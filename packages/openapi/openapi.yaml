openapi: 3.0.3
info:
  title: KoalaCast REST API
  description: Privacy-first podcast player REST API for web and cross-device synchronization.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: "Server Root (Operational Probes & Versioned API)"

security: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: "Liveness Probe (Status: Implemented)"
      description: "Returns operational liveness status of the API server."
      responses:
        '200':
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: "Bad request"
        '500':
          description: "Internal server error"

  /readyz:
    get:
      operationId: getReadyz
      summary: "Readiness Probe (Status: Implemented)"
      description: "Returns operational readiness status of the API server and SQLite database connection."
      responses:
        '200':
          description: "Service and database are ready"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          description: "Bad request"
        '503':
          description: "Database or service is unavailable"

  /api/v1/healthz:
    get:
      operationId: getApiV1Healthz
      summary: "Versioned Liveness Probe (Status: Implemented)"
      responses:
        '200':
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: "Bad request"
        '500':
          description: "Internal server error"

  /api/v1/readyz:
    get:
      operationId: getApiV1Readyz
      summary: "Versioned Readiness Probe (Status: Implemented)"
      responses:
        '200':
          description: "Service and database are ready"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          description: "Bad request"
        '503':
          description: "Database or service is unavailable"

  /api/v1/auth/register:
    post:
      operationId: postApiV1AuthRegister
      summary: "User Registration (Status: Specified / Planned)"
      description: "Registers a new user account and presents a 32-byte Base32 recovery code."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: "Registration successful"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: "Invalid registration payload"
        '403':
          description: "Registration is disabled"

  /api/v1/auth/login:
    post:
      operationId: postApiV1AuthLogin
      summary: "Web Session Login (Status: Specified / Planned)"
      description: "Authenticates user credentials and sets a same-origin HttpOnly session cookie."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Login successful"
        '400':
          description: "Bad request"
        '401':
          description: "Invalid credentials"

  /api/v1/sync:
    get:
      operationId: getApiV1Sync
      summary: "Incremental Sync Pull (Status: Specified / Planned)"
      description: "Returns incremental changesets since the specified server cursor."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: since_cursor
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: "Incremental changesets returned"
        '400':
          description: "Bad request"
        '401':
          description: "Unauthorized"
        '410':
          description: "Full resync required"

  /api/v1/stats/global:
    get:
      operationId: getGlobalListeningStatistics
      summary: "Opt-in global listening aggregates"
      description: "Returns site-wide aggregates and rankings built exclusively from accounts with global statistics participation enabled."
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [90days, year, all]
            default: year
      responses:
        '200':
          description: "Global statistics"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStatsResponse'
        '400':
          description: "Invalid range"

  /api/v1/stats/preferences:
    get:
      operationId: getGlobalStatsPreference
      summary: "Read the authenticated user's global statistics consent"
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: "Current preference"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStatsPreference'
        '401':
          description: "Unauthorized"
    put:
      operationId: updateGlobalStatsPreference
      summary: "Enable or revoke global statistics participation"
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalStatsPreferenceUpdate'
      responses:
        '200':
          description: "Updated preference"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStatsPreference'
        '400':
          description: "Invalid preference"
        '401':
          description: "Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: koalacast_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"

    ReadinessResponse:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          example: "ready"
        database:
          type: string
          example: "connected"

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8

    RegisterResponse:
      type: object
      required:
        - user_id
        - username
        - recovery_code
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        recovery_code:
          type: string
          example: "AAAA-BBBB-CCCC-DDDD-EEEE-FFFF-GGGG-HHHH"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    GlobalStatsPreference:
      type: object
      required: [global_stats_opt_in, global_stats_opt_in_at]
      properties:
        global_stats_opt_in:
          type: boolean
        global_stats_opt_in_at:
          type: integer
          format: int64

    GlobalStatsPreferenceUpdate:
      type: object
      required: [global_stats_opt_in]
      additionalProperties: false
      properties:
        global_stats_opt_in:
          type: boolean

    GlobalStatsResponse:
      type: object
      required:
        - generated_at
        - range
        - timezone
        - participants
        - total_wall_ms
        - podcast_rankings
        - listener_leaderboard
      properties:
        generated_at:
          type: integer
          format: int64
        range:
          type: string
          enum: [90days, year, all]
        timezone:
          type: string
          example: UTC
        participants:
          type: integer
        total_wall_ms:
          type: integer
          format: int64
        baseline_audio_ms:
          type: integer
          format: int64
        total_saved_ms:
          type: integer
          format: int64
        speed_saved_ms:
          type: integer
          format: int64
        silence_saved_ms:
          type: integer
          format: int64
        manual_skipped_ms:
          type: integer
          format: int64
        intro_outro_skipped_ms:
          type: integer
          format: int64
        average_speed:
          type: number
          format: double
        active_days:
          type: integer
        listening_sessions:
          type: integer
        episodes:
          type: integer
        podcasts:
          type: integer
        weekday_totals:
          type: array
          items: { type: integer, format: int64 }
        hour_totals:
          type: array
          items: { type: integer, format: int64 }
        day_totals:
          type: array
          items: { type: object }
        category_totals:
          type: array
          items: { type: object }
        podcast_rankings:
          type: array
          items: { type: object }
        listener_leaderboard:
          type: array
          items: { type: object }
