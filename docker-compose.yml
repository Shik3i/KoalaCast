services:
  # Single KoalaCast application container (Go Binary serving API & SvelteKit Web)
  # Access the application at http://localhost:3000
  koalacast:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/koalacast.db
      - SESSION_SECRET=${SESSION_SECRET}
      - PEPPER_SECRET=${PEPPER_SECRET:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - KC_REGISTRATION_ENABLED=${KC_REGISTRATION_ENABLED:-}
      - PODCAST_INDEX_KEY=${PODCAST_INDEX_KEY:-}
      - PODCAST_INDEX_SECRET=${PODCAST_INDEX_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - koala_data:/app/data

volumes:
  koala_data:
