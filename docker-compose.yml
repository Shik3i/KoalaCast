services:
  # Single KoalaCast application container (Go Binary serving API & SvelteKit Web)
  # Access the application at http://localhost:3000
  koalacast:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - KC_AUDIO_EFFECTS_PROXY_ENABLED=${KC_AUDIO_EFFECTS_PROXY_ENABLED:-false}
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/koalacast.db
      - SESSION_SECRET=${SESSION_SECRET}
      - PEPPER_SECRET=${PEPPER_SECRET:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - KC_REGISTRATION_ENABLED=${KC_REGISTRATION_ENABLED:-}
      - PODCAST_INDEX_KEY=${PODCAST_INDEX_KEY:-}
      - PODCAST_INDEX_SECRET=${PODCAST_INDEX_SECRET:-}
      - FEED_MAX_RESPONSE_BYTES=${FEED_MAX_RESPONSE_BYTES:-33554432}
      - FEED_MAX_STORED_EPISODES=${FEED_MAX_STORED_EPISODES:-200}
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT:-http://localhost:3000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - koala_data:/app/data

volumes:
  koala_data:
