# Robolectric runs against a real android-all runtime, and the newest one it
# ships is API 36. Without this it reads targetSdkVersion from the merged
# manifest (37) and refuses to start every test in the module.
#
# This only pins the runtime the tests execute on; the app's own
# targetSdkVersion is unaffected. Raise it when Robolectric ships API 37.
sdk=36
