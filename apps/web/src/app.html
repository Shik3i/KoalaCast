<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="KoalaCast - Free, open-source, privacy-first podcast player with cross-device sync." />
		<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#13221c" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<title>KoalaCast</title>

		<script>
			(function() {
				try {
					var saved = localStorage.getItem('koalacast_theme');
					if (saved === 'dark' || saved === 'light') {
						document.documentElement.setAttribute('data-theme', saved);
					}
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
