<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta id="koalacast-description" name="description" content="KoalaCast - Free, open-source, privacy-first podcast player with cross-device sync." />
		<meta name="application-name" content="KoalaCast" />
		<meta name="author" content="KoalaCast contributors" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#06100c" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icon-192.png" />
		<title>KoalaCast</title>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "KoalaCast",
				"url": "https://cast.koalastuff.net/",
				"applicationCategory": "MultimediaApplication",
				"operatingSystem": "Web",
				"isAccessibleForFree": true,
				"softwareHelp": "https://github.com/Shik3i/KoalaCast",
				"license": "https://opensource.org/license/mit",
				"description": "Free, open-source, privacy-first podcast player with local-first storage and optional cross-device sync."
			}
		</script>

		<script>
			(function() {
				try {
					var saved = localStorage.getItem('koalacast_theme');
					if (saved === 'dark' || saved === 'light') {
						document.documentElement.setAttribute('data-theme', saved);
					} else if (saved !== 'system') {
						document.documentElement.setAttribute('data-theme', 'dark');
					}
					var palette = localStorage.getItem('koalacast_palette');
					if (
						palette === 'eucalyptus' ||
						palette === 'fjord' ||
						palette === 'ember' ||
						palette === 'lavender' ||
						palette === 'aurora' ||
						palette === 'sandstone' ||
						palette === 'obsidian' ||
						palette === 'paper' ||
						palette === 'ultraviolet'
					) {
						document.documentElement.setAttribute('data-palette', palette);
					} else {
						document.documentElement.setAttribute('data-palette', 'eucalyptus');
					}
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
