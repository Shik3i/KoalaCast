name: Tests

# Reusable test suite. Called by CI (on every push/PR) and gated in front of the
# Docker release so nothing ships without a green build.
# Action majors reviewed against official upstream documentation: 2026-07-28.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Go backend (vet, fmt, race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Track the toolchain declared in go.mod instead of a hard-coded version.
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: gofmt (check)
        working-directory: services/api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: services/api
        run: go vet ./...

      - name: go test (race)
        working-directory: services/api
        run: go test -race -count=1 ./...

  frontend:
    name: SvelteKit frontend (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run check

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      # Fails on structural translation problems (unknown keys, broken
      # placeholders, missing plural forms). Untranslated keys are reported as
      # warnings so a partial new language can still land.
      - name: Translation check
        working-directory: apps/web
        run: npm run check:i18n

      - name: Documentation links and current-state assertions
        working-directory: apps/web
        run: npm run check:docs

      - name: Release policy
        working-directory: apps/web
        run: npm run check:release-policy

      - name: SEO metadata check
        working-directory: apps/web
        run: npm run check:seo

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Install compact UI test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Compact viewport UI regressions
        working-directory: apps/web
        run: npm run test:ui

      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compact-ui-test-results
          path: |
            apps/web/playwright-report
            apps/web/test-results

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npx -y @redocly/cli lint packages/openapi/openapi.yaml
