name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and release lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Keep the invocations separate. Lint can race KSP/Hilt output cleanup
      # when it shares a task graph with both unit-test variants.
      - name: Debug unit tests
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Release unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Release lint
        working-directory: apps/android
        run: ./gradlew --no-daemon lintRelease
