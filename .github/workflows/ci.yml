name: CI

# Fast feedback on every change: the shared test suite plus a real image build and
# runtime smoke test. Does NOT publish anything — releases are separate workflows.
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'packages/openapi/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/docker-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'packages/openapi/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/docker-release.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker-build:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build image (single-arch, load into the runner)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: koalacast:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke test the running container
        run: |
          docker run -d --name kc \
            -e SESSION_SECRET=ci-session-secret-0123456789abcdef \
            -p 3000:3000 koalacast:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "container healthy"
              docker rm -f kc >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy in time"
          docker logs kc
          docker rm -f kc >/dev/null
          exit 1
