name: CI

# Fast feedback on every change: the shared test suite plus a real image build and
# runtime smoke test. Does NOT publish anything — releases are separate workflows.
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'packages/openapi/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/docker-release.yml'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/android-release.yml'
      - 'scripts/check-android-release*'
      - 'scripts/check-main-security*'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'packages/openapi/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/docker-release.yml'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/android-release.yml'
      - 'scripts/check-android-release*'
      - 'scripts/check-main-security*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker-build:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Verify ARM64 emulation
        run: |
          # Reuse the pinned multi-arch Node image from the Dockerfile.
          image=$(awk '/^FROM .*node:/ { print $3; exit }' Dockerfile)
          test -n "$image"
          test "$(docker run --rm --platform linux/arm64 "$image" uname -m)" = aarch64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build image (single-arch, load into the runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: koalacast:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke test the running container
        run: |
          docker run -d --name kc \
            -e SESSION_SECRET=ci-session-secret-0123456789abcdef \
            -p 3000:3000 koalacast:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "container healthy"
              docker rm -f kc >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy in time"
          docker logs kc
          docker rm -f kc >/dev/null
          exit 1
