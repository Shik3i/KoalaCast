name: CI

# Fast feedback on every change: the shared test suite plus a real image build and
# runtime smoke test. Does NOT publish anything — releases are separate workflows.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker-build:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build image (single-arch, load into the runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: koalacast:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      # The release builds arm64 too. Cross-compilation (rather than emulation)
      # means a target-specific toolchain has to resolve, so a broken arm64
      # build must fail here rather than at tag time. Not loaded or run — the
      # runner is amd64; xx-verify inside the build asserts the binary's
      # architecture.
      - name: Cross-compile check (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64

      - name: Smoke test the running container
        run: |
          docker run -d --name kc \
            -e SESSION_SECRET=ci-session-secret-0123456789abcdef \
            -p 3000:3000 koalacast:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "container healthy"
              docker rm -f kc >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy in time"
          docker logs kc
          docker rm -f kc >/dev/null
          exit 1
