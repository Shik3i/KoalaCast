name: Release · Android app

# Builds and publishes ONLY the Android app (APK/AAB + zip). Trigger it
# independently of the Docker image:
#   - push an android tag ->  git tag android-v0.1.0 && git push origin android-v0.1.0
#   - or run it manually  ->  Actions ▸ "Release · Android app" ▸ Run workflow
# A `v*` docker tag never triggers this workflow, and `android-v*` never triggers
# the Docker one, so you rebuild only what changed.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle assembly task'
        type: choice
        default: assembleRelease
        options:
          - assembleRelease
          - bundleRelease

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, attest & release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless signing for the artifact attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6

      # The Android app isn't scaffolded yet — fail loudly (rather than silently
      # producing nothing) until a Gradle project exists under apps/android/.
      - name: Preflight — Gradle project present?
        run: |
          if [ ! -f apps/android/gradlew ] \
             && [ ! -f apps/android/settings.gradle ] \
             && [ ! -f apps/android/settings.gradle.kts ]; then
            echo "::error::No Gradle Android project under apps/android/. This workflow is ready; scaffold the app (gradlew + settings.gradle) to enable releases."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # A GitHub Release must never contain an unsigned or debug-signed package.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Android signing secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/android/release.keystore
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/apps/android/release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint and build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lint "${{ github.event.inputs.gradle_task || 'assembleRelease' }}"

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist
          find apps/android -path '*/build/outputs/*' \( -name '*.apk' -o -name '*.aab' \) -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::Gradle produced no .apk/.aab under build/outputs."
            exit 1
          fi
          zip_name="koalacast-android-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../$zip_name" .)
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Verify package signatures
        run: |
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner was not found below $ANDROID_HOME/build-tools."
            exit 1
          fi
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            "$apksigner_bin" verify --verbose --print-certs "$apk"
          done
          for bundle in dist/*.aab; do
            [ -e "$bundle" ] || continue
            jarsigner -verify -strict "$bundle"
          done

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*
            ${{ steps.artifacts.outputs.zip }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: koalacast-android-${{ github.ref_name }}
          path: |
            dist/*
            ${{ steps.artifacts.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(ls dist/*.apk dist/*.aab 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --title "KoalaCast Android $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.artifacts.outputs.zip }}" $assets
