name: Release · Android app

# Builds and publishes ONLY the Android app (APK/AAB + zip). Trigger it
# independently of the Docker image:
#   - push an android tag ->  git tag android-v0.1.0 && git push origin android-v0.1.0
#   - or run it manually  ->  Actions ▸ "Release · Android app" ▸ Run workflow
# A `v*` docker tag never triggers this workflow, and `android-v*` never triggers
# the Docker one, so you rebuild only what changed.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle assembly task'
        type: choice
        default: assembleRelease
        options:
          - assembleRelease
          - bundleRelease

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, attest & release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless signing for the artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # The Android app isn't scaffolded yet — fail loudly (rather than silently
      # producing nothing) until a Gradle project exists under apps/android/.
      - name: Preflight — Gradle project present?
        run: |
          if [ ! -f apps/android/gradlew ] \
             && [ ! -f apps/android/settings.gradle ] \
             && [ ! -f apps/android/settings.gradle.kts ]; then
            echo "::error::No Gradle Android project under apps/android/. This workflow is ready; scaffold the app (gradlew + settings.gradle) to enable releases."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Optional release signing: decode a base64 keystore from secrets when present.
      # Configure signingConfigs in the Gradle module to read these env vars. Guard
      # inside the script (a step's own env isn't visible to its `if`), so this is a
      # no-op — building unsigned — when the secret is absent.
      - name: Decode signing keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/android/release.keystore
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/apps/android/release.keystore" >> "$GITHUB_ENV"
            echo "Signing keystore configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building unsigned."
          fi

      - name: Build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon "${{ github.event.inputs.gradle_task || 'assembleRelease' }}"

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist
          find apps/android -path '*/build/outputs/*' \( -name '*.apk' -o -name '*.aab' \) -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::Gradle produced no .apk/.aab under build/outputs."
            exit 1
          fi
          zip_name="koalacast-android-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../$zip_name" .)
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(ls dist/*.apk dist/*.aab 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --title "KoalaCast Android $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.artifacts.outputs.zip }}" $assets
